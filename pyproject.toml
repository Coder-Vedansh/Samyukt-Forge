[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-cli"
version = "0.1.0"
description = "A next-generation open-source AI developer platform (Linux for AI)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Forge Contributors" },
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.1",
    "pydantic>=2.7.0",
    "pluggy>=1.5.0",
]

[project.scripts]
forge = "forge_cli.cli.main:app"
